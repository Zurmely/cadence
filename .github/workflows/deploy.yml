name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Ensure GitHub Pages uses Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "/repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=workflow \
              -f cname=cadence.zurmely.com
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=workflow
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=workflow \
              -f cname=cadence.zurmely.com
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
